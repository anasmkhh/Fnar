<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آخر فنار</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#04080e;--deep:#09151f;--brass:#a58a5c;--lamp:#e2c07a;--teal:#5f8f93;--ember:#a8493a;--paper:#d3cdbd;--mute:#788b95;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(ellipse at 50% 0,#0e202c,var(--ink) 70%);color:var(--paper);font-family:Tajawal,system-ui,sans-serif;line-height:1.6;min-height:100vh}
#app{max-width:460px;margin:0 auto;padding:10px 12px 20px}
header{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{display:flex;gap:8px;align-items:center;background:rgba(11,31,49,.8);border:1px solid #1a2b38;border-radius:12px;padding:7px 10px;font-size:13px}
.st svg{width:22px;height:22px;flex:none}
.st>div{flex:1}
.bar{height:7px;border-radius:4px;background:#05101a;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:100%;border-radius:4px;transition:width .2s}
#hpb{background:linear-gradient(90deg,#b8402f,#ff7a59)}#oilb{background:linear-gradient(90deg,#d8a657,#ffe08a)}
.chips{grid-column:1/-1;display:flex;gap:6px;font-size:13px}
.chips span{flex:1;text-align:center;background:rgba(216,166,87,.12);border:1px solid rgba(216,166,87,.35);border-radius:999px;padding:2px 6px;color:var(--brass)}
.stage{position:relative;border-radius:18px;overflow:hidden;border:2px solid var(--brass);box-shadow:0 0 0 4px #0a1a28,0 10px 40px rgba(0,0,0,.6)}
body.play{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:auto;touch-action:none}
.stage{isolation:isolate}
#toast{position:absolute;inset-inline:12px;top:12px;padding:10px 14px;border-radius:12px;background:rgba(6,16,28,.92);border:1px solid var(--brass);font-size:14px;opacity:0;transform:translateY(-6px);transition:.3s;pointer-events:none}
#toast.th{font-style:italic;color:#9fb0b8;border-color:#26394a;background:rgba(4,10,16,.82)}
#toast.on{opacity:1;transform:none}#toast.bad{border-color:var(--ember)}
#panel{position:absolute;inset:0;background:linear-gradient(#0a1822f2,#03080df7);padding:22px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
#panel h1,#panel h2{font-family:'Aref Ruqaa',serif;color:var(--lamp);margin:0;line-height:1.2;text-shadow:0 0 22px rgba(226,192,122,.18)}
#panel h1{font-size:46px}#panel h2{font-size:30px}
#panel p{margin:0}
.steps{display:grid;gap:8px}
.steps p{background:rgba(255,255,255,.05);border-inline-start:3px solid var(--teal);border-radius:8px;padding:8px 12px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;color:var(--paper);background:rgba(255,255,255,.06);border:1px solid rgba(216,166,87,.5);border-radius:12px;min-height:56px;padding:8px 12px;cursor:pointer;text-align:start;transition:background .15s,transform .1s}
button:hover:not(:disabled){background:rgba(216,166,87,.18)}button:active:not(:disabled){transform:scale(.97)}
button b{display:block;font-size:15px}
button small{display:block;color:var(--mute);font-size:12px}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
button.go{background:linear-gradient(var(--lamp),var(--brass));color:#1b1405;border:0;font-weight:700;font-size:18px;text-align:center;margin-top:auto;box-shadow:0 4px 18px rgba(255,211,110,.3)}
.note{background:#efe6d2;color:#2b2113;border-radius:6px;padding:14px 16px;font-family:'Aref Ruqaa',serif;font-size:19px;line-height:1.8;box-shadow:3px 3px 0 rgba(0,0,0,.4);transform:rotate(-.6deg)}
.note small{display:block;font-family:Tajawal,sans-serif;font-size:12px;color:#7a6a4a;margin-bottom:4px}
.dots{color:var(--brass);letter-spacing:4px}
#ctl{display:none;margin-top:12px;gap:10px;align-items:center}
#ctl.on{display:flex}
#tm{min-width:104px;text-align:center;background:rgba(11,31,49,.8);border:1px solid #1a2b38;border-radius:12px;padding:12px 8px;font-size:14px;color:var(--brass)}
#lt{flex:1;min-height:60px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700;border-radius:999px}
#lt svg{width:26px;height:26px}
#lt.lit{background:linear-gradient(var(--lamp),var(--brass));color:#1b1405;border:0;box-shadow:0 0 28px rgba(255,211,110,.55)}
.hint{margin:12px 0 0;padding:10px 14px;font-size:15px;background:rgba(58,166,160,.12);border-inline-start:4px solid var(--teal);border-radius:8px;min-height:48px}


#panel{background:none;padding:29% 16px 12px;gap:7px}
#panel .steps{gap:6px}
#panel .steps p{font-size:14px;padding:6px 10px;line-height:1.55}
#panel h1{font-size:36px;text-align:center;color:#d9d0bb;text-shadow:0 2px 0 #000,0 0 26px rgba(0,0,0,.8)}
#panel h2{font-size:28px;text-align:center;color:#d9d0bb;text-shadow:0 2px 0 #000,0 0 22px rgba(0,0,0,.8)}
#panel>p{text-shadow:0 1px 6px #000;font-size:14px;line-height:1.6}
#panel button.go{min-height:46px;font-size:17px}
#panel .steps p,#panel .grid button,#panel button:not(.go){background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .6  0 0 0 0 .6  0 0 0 .3 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),linear-gradient(180deg,rgba(40,45,48,.92),rgba(22,26,28,.94));border:1px solid #6b5a3c;box-shadow:inset 0 0 0 1px #1b150e,0 4px 12px rgba(0,0,0,.5)}
#panel .steps p{border-inline-start:3px solid #6b5a3c;border-radius:6px}
#panel button.go{background:linear-gradient(180deg,#4b3b22,#2e2314);color:#e2c07a;border:1px solid #8b7448;box-shadow:inset 0 0 0 1px #1b150e,0 4px 14px rgba(0,0,0,.55)}
#opb{min-height:0;padding:2px 10px;border-radius:999px;font-size:13px;flex:none;display:inline-flex;align-items:center;gap:5px}
#opb svg{width:14px;height:14px}
#dim{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0;z-index:99}
#opt{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;gap:8px;padding:30% 14px 12px;overflow:auto;background:none}
#opt[hidden]{display:none!important}
#opt>*{flex-shrink:0}
body.optopen #panel{visibility:hidden}
#opt .back{position:absolute;top:12px;right:12px;width:50px;height:50px;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#d6cfbd}
#opt h2{font-family:'Aref Ruqaa',serif;font-size:30px;margin:0;text-align:center;color:#ddd4bf;text-shadow:0 2px 0 #000,0 0 24px rgba(0,0,0,.9);line-height:1.1}
#opt .orn{display:flex;align-items:center;gap:8px;color:#a58a5c;margin-top:-4px}
#opt .orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#8b7448 40%,#8b7448 60%,transparent)}
#opt .orn svg{width:24px;height:24px}
#opt .sub{margin:0 0 2px;text-align:center;color:#8b9aa2;font-size:14px;text-shadow:0 1px 6px #000}
#opt .row,#opt .act{position:relative;display:flex;align-items:center;gap:12px;border-radius:8px;padding:7px 14px;min-height:46px;color:#d6cfbd;font-size:16px;border:1px solid #6b5a3c;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .6  0 0 0 0 .6  0 0 0 .3 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),linear-gradient(180deg,rgba(42,46,48,.94),rgba(24,28,30,.96));box-shadow:inset 0 0 0 1px #1b150e,inset 0 0 0 3px rgba(0,0,0,.25),0 5px 14px rgba(0,0,0,.55)}
#opt .row::before,#opt .row::after,#opt .act::before,#opt .act::after{content:"";position:absolute;width:9px;height:9px;border:2px solid #8b7448;opacity:.8}
#opt .row::before,#opt .act::before{top:3px;right:3px;border-left:0;border-bottom:0}
#opt .row::after,#opt .act::after{bottom:3px;left:3px;border-right:0;border-top:0}
#opt .row>svg,#opt .act>svg{width:28px;height:28px;flex:none;color:#cfc7b4}
#opt .row>span,#opt .act>span{flex:1;text-align:right}
#opt .row.sl{flex-wrap:wrap}
#opt .row.sl input{flex:0 0 100%;order:3}
#opt .sw{width:56px;height:30px;min-height:0;padding:0;border-radius:17px;border:1px solid #000;background:#3a1b1b;position:relative;flex:none;box-shadow:inset 0 2px 5px rgba(0,0,0,.8)}
#opt .sw::after{content:"";position:absolute;top:2px;left:3px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dcd6c2,#7d7766);border:1px solid #2b2618;transition:left .15s;box-shadow:0 2px 4px rgba(0,0,0,.6)}
#opt .sw[aria-checked=true]{background:#1d4640}
#opt .sw[aria-checked=true]::after{left:28px}
#opt .row.off .w{display:none}
#opt .row:not(.off) .x{display:none}
#opt input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:6px;border:1px solid #000;direction:ltr;margin:4px 0 2px;background:linear-gradient(90deg,#b0573a var(--p,100%),#0c0f11 var(--p,100%))}
#opt input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dcd6c2,#7d7766);border:1px solid #2b2618;box-shadow:0 2px 4px rgba(0,0,0,.6)}
#opt input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#dcd6c2,#7d7766);border:1px solid #2b2618}
#opt input[type=range]::-moz-range-track{background:transparent}
#opt .act{cursor:pointer;font-weight:700;font-size:18px;min-height:50px;text-align:right;width:100%}
#opt .act.red{color:#d9674c;border-color:#8c4a38;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .6  0 0 0 0 .6  0 0 0 .3 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),linear-gradient(180deg,#5a2119,#34120e)}
#opt .act.red>svg{color:#d9674c}
#opt .act.sea{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .6  0 0 0 0 .6  0 0 0 0 .6  0 0 0 .3 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"),linear-gradient(180deg,#1f3a3a,#122424)}
#opt .gap{flex:1;min-height:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app">

tton class="act red" id="rst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4v5h-5"/></svg><span>إعادة اللعبة</span></button><div class="gap"></div><button class="act sea" id="sea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9c3-3 5 3 9 0s6-3 9 0M3 15c3-3 5 3 9 0s6-3 9 0"/></svg><span>عودة إلى البحر</span></button></div></div>
  <div id="ctl"><span id="tm"></span><button id="lt"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 21h6v-1H9zm3-19a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg><span id="lts"></span></button></div>
  <p class="hint" id="hint">اسحب إصبعك على الشاشة لتوجيه الشعاع، وضغطة سريعة لتشغيل الضوء أو إطفائه.</p>

<script>
const $=s=>document.querySelector(s);
let AC,mute=false,amb,vibOn=true,optOpen=false;const parts=[];
const vibe=n=>{try{vibOn&&navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
function ctx(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function snd(f,d,ty='sine',v=.12,sl=0){if(mute)return;try{const a=ctx(),o=a.createOscillator(),k=a.createGain(),n=a.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);k.gain.setValueAtTime(v*2.5,n);k.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(k).connect(a.destination);o.start();o.stop(n+d)}catch(e){}}
function startAmb(){if(amb)return;try{const a=ctx(),b=a.createBuffer(1,a.sampleRate*2,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),k=a.createGain(),l=a.createOscillator(),lg=a.createGain();s.buffer=b;s.loop=true;f.type='lowpass';f.frequency.value=280;k.gain.value=mute?0:.15;l.frequency.value=.12;lg.gain.value=.08;l.connect(lg).connect(k.gain);s.connect(f).connect(k).connect(a.destination);s.start();l.start();amb={k}}catch(e){}}
function burst(x,y,c){for(let i=0;i<14;i++){const a=R(0,6.283),v=R(20,70);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,c})}}
addEventListener('pointerdown',()=>{if(!mute)startAmb()},{once:true});
const cv=$('#c'),g=cv.getContext('2d'),W=360,H=540,CX=180,CY=270,DUR=34,DAYS=5;let BR=240,ev={};
const DPR=Math.min(3,Math.max(2,Math.ceil(devicePixelRatio||2)));cv.width=W*DPR;cv.height=H*DPR;g.scale(DPR,DPR);
const S={},R=(a,b)=>a+Math.random()*(b-a),wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const STORIES=["مرّت السفينة بسلام. لم يلوّح أحد، ولم يعرف أحد أنك هنا.","ابتعد الضوء الصغير على الماء حتى ابتلعه الظلام، وبقيت وحدك.","نجا الطاقم. ربما سيذكرون الضوء يومًا، ولن يذكروك.","عبرت السفينة بصمت. لا صوت سوى الموج وأنفاسك.","تلاشت أضواؤها في الأفق، وبقي الليل أطول من قبل.","نجوا، وبقيت أنت مع الصخور والملح.","لا شكر ولا وداع. الفنار لا ينتظر شيئًا من أحد."];
const DAYT=["الليلة الأولى. البحر ساكن، وليس في الفنار غيرك.","الصمت ثقيل في الفنار. في الغرفة العليا دفتر قديم، اقرأه عند الفجر.","عاصفة الليلة. الريح تعوي حول البرج، ولا أحد يسمعها سواك.","ضباب كثيف يبتلع الشعاع. وصفحات الدفتر تتحدث عن تثبيت الضوء.","آخر ليلة. عاصفة وضباب معًا. الغرقى ينتظرون، وأنت الوحيد الذي يراهم."];
const NOTES=["أنا سالم، الناجي الوحيد من سفينة نجمة الصباح. أشعلت هذا الفنار كي لا يغرق أحد بعدي.","رأيت الليلة أضواءً تحت الماء تتبع شعاعي. ظننتها وحوشًا، فخفت وأطفأت المصباح.","أطفأت المصباح فاصطدمت سفينة بالصخور. والأضواء لا تؤذي إلا من يهرب منها. جرّبت تثبيت الشعاع على واحد منها فهدأ وتحوّل إلى ضوء أزرق صعد إلى السماء.","عرفتها من أصواتها. هذا طاقم نجمة الصباح. يتبعون الضوء لأنه آخر ما رأوه قبل الغرق. ثبّت الشعاع عليهم، فهم يبحثون عن الطريق وليس عن الأذى."];
let streak=0,lflash=0,lnext=4,sto=[],ships=[],crs=[],souls=[],spawns=[],T=0,t=0,ang=-Math.PI/2,tg=ang,flash=0,nSaved=0,nLost=0,nFreed=0,tt;
const rocks=[],sparks=[],IV=[1,.92,1.05,.95,1.08,.9,1,1.04];
for(let i=0;i<15;i++)rocks.push({a:i/15*6.283+R(-.15,.15),r:R(86,100),s:R(7,12),v:Array.from({length:7},()=>R(.72,1.15))});

function drawRock(o){

 g.fillStyle=SH;blob(x+3,y+4,s,o.v);g.fill();
 const P=o.v.map((m,i)=>{const a=i/o.v.length*6.283;return [x+Math.cos(a)*s*m,y+Math.sin(a)*s*m]});
 const q=g.createLinearGradient(x-s,y-s,x+s,y+s);q.addColorStop(0,'#52697a');q.addColorStop(.5,'#2a3c4c');q.addColorStop(1,'#101c27');

 g.fillStyle='rgba(200,228,242,.30)';poly([[x,y],P[4],P[5]]);g.fill();

 g.restore();
 g.strokeStyle='rgba(150,190,210,.45)';g.lineWidth=1;poly(P);g.stroke();
}

 g.fillStyle=q;hull(1);g.fill();g.strokeStyle=lit?'#fff0c0':'#6e5238';g.lineWidth=1.2;g.stroke();

 g.strokeStyle=lit?'rgba(110,70,40,.4)':'rgba(10,6,3,.45)';g.lineWidth=.8;g.beginPath();for(let x=-8;x<=12;x+=4){g.moveTo(x,-4.6);g.lineTo(x,4.6)}g.stroke();

 g.fillStyle='#4a3220';cir(4,0,1.6);
 g.save();g.globalCompositeOperation='lighter';glow(15,0,9,'rgba(255,211,110,.55)','rgba(255,190,80,0)');glow(-12.5,0,7,'rgba(255,211,110,.4)','rgba(255,190,80,0)');g.restore();

 g.textAlign='center';g.font='700 12px Tajawal,sans-serif';g.fillStyle='rgba(190,215,225,.75)';if(!menu){g.save();g.globalAlpha=.35;lab('الفنار',CX,CY+52);g.restore()}

let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;T+=dt;flash=Math.max(0,flash-dt*1.5);lflash=Math.max(0,lflash-dt*2.5);shake=Math.max(0,shake-dt*2.2);if(!optOpen)update(dt);draw();requestAnimationFrame(loop)}

/* ===== شاشة الخيارات ===== */
const OPT={snd:true,vib:true,br:100};
function saveOpt(){try{localStorage.setItem('fanarOpt',JSON.stringify(OPT))}catch(e){}}
function loadOpt(){try{Object.assign(OPT,JSON.parse(localStorage.getItem('fanarOpt')||'{}'))}catch(e){}mute=!OPT.snd;vibOn=!!OPT.vib}
function setSw(id,rowId,on){$(id).setAttribute('aria-checked',on?'true':'false');$(rowId).classList.toggle('off',!on)}
function applyBr(){const v=OPT.br;$('#dim').style.opacity=((100-v)/100*.85).toFixed(3);$('#rngB').style.setProperty('--p',((v-30)/70*100)+'%')}
function syncOpt(){setSw('#swS','#rowS',OPT.snd);setSw('#swV','#rowV',OPT.vib);$('#rngB').value=OPT.br;applyBr()}
function openOpt(){optOpen=true;document.body.classList.add('optopen');document.body.classList.remove('play');$('#opt').hidden=false;syncOpt()}
function closeOpt(){optOpen=false;document.body.classList.remove('optopen');$('#opt').hidden=true;if(S.phase==='night')document.body.classList.add('play')}
$('#opb').onclick=openOpt;$('#optx').onclick=closeOpt;$('#sea').onclick=closeOpt;
addEventListener('keydown',e=>{if(e.key==='Escape'&&optOpen)closeOpt()});
$('#swS').onclick=()=>{OPT.snd=!OPT.snd;mute=!OPT.snd;if(amb)amb.k.gain.value=mute?0:.15;else if(!mute)startAmb();syncOpt();saveOpt();snd(330,.15,'sine',.08)};
$('#swV').onclick=()=>{OPT.vib=!OPT.vib;vibOn=OPT.vib;syncOpt();saveOpt();vibe(40)};
$('#rngB').oninput=e=>{OPT.br=+e.target.value;applyBr();saveOpt()};
let rstT=0;$('#rst').onclick=()=>{const sp=$('#rst').querySelector('span');if(!rstT){sp.textContent='اضغط مرة أخرى للتأكيد';rstT=setTimeout(()=>{rstT=0;sp.textContent='إعادة اللعبة'},3000);return}
 clearTimeout(rstT);rstT=0;sp.textContent='إعادة اللعبة';closeOpt();ships=[];crs=[];souls=[];spawns=[];parts.length=0;document.body.classList.remove('play');intro()};
loadOpt();syncOpt();
intro();requestAnimationFrame(loop);
